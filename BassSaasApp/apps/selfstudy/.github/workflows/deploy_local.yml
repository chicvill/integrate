name: Auto Rebuild on Local Windows PC

on:
  push:
    branches:
      - main

jobs:
  rebuild-local:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Local Deployment Batch Script
        shell: cmd
        run: |
          call .github\workflows\deploy_local.bat
