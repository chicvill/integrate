<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyCafe2 — 스터디카페 좌석 관제 시스템</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --card-bg: #ffffff;
      --line: #000000;
      --line-subtle: #cccccc;
      --highlight: #f4f4f4;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-family);
      line-height: 1.4;
      padding-bottom: 70px;
    }
    header {
      border-bottom: 2px solid var(--line);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .brand { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
    .header-links a {
      color: var(--fg);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
      padding: 4px 8px;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 14px 16px; }

    /* ── 상단 3대 브리핑 메트릭 ── */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .metric-box {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: center;
    }
    .metric-box .label { font-size: 11px; font-weight: 700; color: #555; }
    .metric-box .val { font-size: 20px; font-weight: 900; margin-top: 2px; }

    /* ── 탭 네비게이션 ── */
    .nav-tabs {
      display: flex;
      border-bottom: 2px solid var(--line);
      margin-bottom: 14px;
      gap: 4px;
      overflow-x: auto;
    }
    .nav-tab {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      background: #fff;
      color: #000;
      border: 1px solid var(--line);
      border-bottom: none;
      cursor: pointer;
    }
    .nav-tab.active { background: #000; color: #fff; }

    /* ── 안내 알림 배너 ── */
    .app-alert {
      border: 2px solid #000;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      display: none;
    }
    .app-alert.warning { background: #fffbe6; border-color: #d48806; color: #d48806; }
    .app-alert.error { background: #fff1f0; border-color: #cf1322; color: #cf1322; }
    .app-alert.success { background: #f6ffed; border-color: #389e0d; color: #389e0d; }

    /* ── 좌석 배치도 그리드 (실시간 관제) ── */
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }
    .seat-card {
      border: 1px solid var(--line);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      background: #fff;
      position: relative;
    }
    .seat-card.status-OCCUPIED { border-width: 2px; }
    .seat-card.status-STEP_OUT { border-style: dashed; border-width: 2px; background: #fafafa; }
    .seat-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line-subtle);
      padding-bottom: 4px;
    }
    .seat-num { font-size: 16px; font-weight: 900; }
    .seat-zone { font-size: 9px; font-weight: 800; border: 1px solid #000; padding: 1px 4px; }
    .seat-body { margin: 6px 0; font-size: 12px; }
    .seat-name { font-weight: 800; font-size: 13px; }
    .seat-time { font-size: 10px; color: #666; margin-top: 2px; }
    .seat-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 4px;
      border: 1px solid #000;
      margin-top: 4px;
    }
    .badge-empty { background: #fff; color: #888; border-color: #ccc; }
    .badge-occ { background: #000; color: #fff; }
    .badge-out { background: #fff; color: #000; }
    .seat-actions { display: flex; gap: 4px; margin-top: 6px; }
    .seat-actions button {
      flex: 1;
      padding: 4px;
      font-size: 11px;
      font-weight: 700;
      background: #fff;
      color: #000;
      border: 1px solid #000;
      cursor: pointer;
    }
    .seat-actions button:hover { background: #000; color: #fff; }

    /* ── 테이블 ── */
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 8px;
    }
    table.data-table th, table.data-table td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: left;
    }
    table.data-table th { background: #f2f2f2; font-weight: 800; }

    /* ── 하단 고정 바 (스마트폰 최적화) ── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #000;
      color: #fff;
      display: flex;
      padding: 8px 12px;
      gap: 8px;
      z-index: 200;
      border-top: 2px solid #000;
    }
    .bottom-bar button {
      flex: 1;
      padding: 10px 4px;
      font-size: 13px;
      font-weight: 800;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
    }
    .bottom-bar button.btn-primary {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
    }

    /* ── 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #fff;
      border: 2px solid #000;
      padding: 18px;
      width: 100%;
      max-width: 440px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #000;
      font-size: 13px;
    }
    button.btn-block {
      width: 100%;
      padding: 10px;
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">STUDYCAFE 2.0</div>
    <div class="header-links">
      <a href="manual.html" target="_blank">📖 매뉴얼 / 인쇄</a>
    </div>
  </header>

  <div class="container">
    <!-- 안내 배너 -->
    <div class="app-alert" id="appAlert"></div>

    <!-- 3대 핵심 브리핑 -->
    <div class="metric-grid">
      <div class="metric-box">
        <div class="label">총 좌석</div>
        <div class="val" id="metricTotal">20</div>
      </div>
      <div class="metric-box">
        <div class="label">이용 중 (외출)</div>
        <div class="val" id="metricOccupied">0 (0)</div>
      </div>
      <div class="metric-box">
        <div class="label">잔여 공석</div>
        <div class="val" id="metricEmpty">20</div>
      </div>
    </div>

    <!-- 탭 네비게이션 -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="setTab('seats')">실시간 좌석도</button>
      <button class="nav-tab" onclick="setTab('tickets')">이용권 / 회원</button>
      <button class="nav-tab" onclick="setTab('ai')">AI 비서 (자연어)</button>
    </div>

    <!-- [탭 1] 실시간 좌석 관제 배치도 -->
    <div id="secSeats">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:12px;font-weight:800;">좌석 실시간 상태 (A-01 ~ A-20)</span>
        <button style="border:1px solid #000;background:#fff;padding:4px 8px;font-size:11px;font-weight:700;" onclick="loadSeats()">새로고침 🔄</button>
      </div>
      <div class="seat-grid" id="seatGrid">
        <div>좌석 정보 로딩 중...</div>
      </div>
    </div>

    <!-- [탭 2] 이용권 / 회원 관리 -->
    <div id="secTickets" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-weight:900;font-size:14px;">회원 보유 이용권 목록</div>
        <button style="border:1px solid #000;background:#000;color:#fff;padding:4px 8px;font-size:11px;" onclick="openModal('modalTicket')">+ 이용권 발급</button>
      </div>
      <table class="data-table" id="ticketsTable">
        <thead>
          <tr><th>회원명</th><th>전화번호</th><th>이용권</th><th>잔여/만기</th><th>상태</th><th>관리</th></tr>
        </thead>
        <tbody><tr><td colspan="6" style="text-align:center;">조회 중...</td></tr></tbody>
      </table>
    </div>

    <!-- [탭 3] AI 도구 비서 -->
    <div id="secAI" style="display:none;">
      <div style="border:2px solid #000;padding:14px;">
        <div style="font-weight:900;font-size:15px;margin-bottom:8px;">스마트 스터디카페 AI 도구 비서</div>
        <div style="font-size:12px;color:#555;margin-bottom:12px;">자연어로 말하면 도메인 객체가 즉시 반응합니다. (예: "A-01번 퇴실시켜줘", "A-07번 외출 처리", "심야 청소년 점검해줘", "현재 좌석 요약해줘")</div>
        <div style="display:flex;gap:6px;margin-bottom:12px;">
          <input type="text" id="aiInput" placeholder="명령 또는 질문을 입력하세요..." style="flex:1;padding:8px;border:1px solid #000;font-size:13px;" onkeydown="if(event.key==='Enter')sendAI()">
          <button style="background:#000;color:#fff;padding:0 14px;border:1px solid #000;font-weight:800;" onclick="sendAI()">실행</button>
        </div>
        <div id="aiResponse" style="border:1px solid #000;padding:12px;min-height:100px;font-size:13px;white-space:pre-wrap;background:#fafafa;">결과가 여기에 표시됩니다.</div>
      </div>
    </div>
  </div>

  <!-- ── 모바일 고정 하단 퀵 액션 바 ── -->
  <div class="bottom-bar">
    <button onclick="openCheckInModal()">⚡ 즉시 입실</button>
    <button onclick="openModal('modalTicket')">🎫 이용권 발급</button>
    <button class="btn-primary" onclick="setTab('ai')">🤖 AI 비서</button>
  </div>

  <!-- ── 입실 모달 ── -->
  <div class="modal-overlay" id="modalCheckIn">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="checkInTitle">⚡ 좌석 입실 처리</h3>
        <button onclick="closeModal('modalCheckIn')" style="border:none;background:none;font-size:18px;font-weight:900;">×</button>
      </div>
      <input type="hidden" id="checkInSeatNum">
      <div class="form-group">
        <label>입실 대상 좌석:</label>
        <input type="text" id="displaySeatNum" readonly style="background:#eee;font-weight:800;">
      </div>
      <div class="form-group">
        <label>회원 전화번호 (010-XXXX-XXXX):</label>
        <input type="tel" id="checkInPhone" placeholder="01012345678">
      </div>
      <div class="form-group">
        <label>회원 성함 (신규 회원인 경우):</label>
        <input type="text" id="checkInName" placeholder="홍길동">
      </div>
      <button class="btn-block" onclick="submitCheckIn()">입실 확정</button>
    </div>
  </div>

  <!-- ── 이용권 발급 모달 ── -->
  <div class="modal-overlay" id="modalTicket">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🎫 이용권 신규 발급</h3>
        <button onclick="closeModal('modalTicket')" style="border:none;background:none;font-size:18px;font-weight:900;">×</button>
      </div>
      <div class="form-group">
        <label>회원 전화번호:</label>
        <input type="tel" id="tkPhone" placeholder="01012345678">
      </div>
      <div class="form-group">
        <label>회원 성함:</label>
        <input type="text" id="tkName" placeholder="홍길동">
      </div>
      <div class="form-group">
        <label>이용권 종류:</label>
        <select id="tkType">
          <option value="2시간권">2시간권 (4,000원)</option>
          <option value="4시간권">4시간권 (7,000원)</option>
          <option value="10시간권">10시간권 (15,000원)</option>
          <option value="50시간권">50시간 충전권 (70,000원)</option>
          <option value="100시간권">100시간 충전권 (130,000원)</option>
          <option value="2주권">2주 기간권 (80,000원)</option>
          <option value="4주권" selected>4주 기간권 (150,000원)</option>
          <option value="4주 관리형">4주 관리형 고정석 (250,000원)</option>
          <option value="12주 올인원">12주 올인원 패스 (380,000원)</option>
        </select>
      </div>
      <button class="btn-block" onclick="submitTicket()">결제 및 발급 완료</button>
    </div>
  </div>

  <script>
    const API_BASE = "/api/studycafe2";

    function setTab(tab) {
      document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
      event.target.classList.add("active");
      document.getElementById("secSeats").style.display = tab === "seats" ? "block" : "none";
      document.getElementById("secTickets").style.display = tab === "tickets" ? "block" : "none";
      document.getElementById("secAI").style.display = tab === "ai" ? "block" : "none";
      if (tab === "seats") loadSeats();
      if (tab === "tickets") loadTickets();
    }

    function setAlert(msg, type = "success") {
      const el = document.getElementById("appAlert");
      el.className = `app-alert ${type}`;
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    async function loadSeats() {
      try {
        const res = await fetch(`${API_BASE}/seats`);
        const data = await res.json();
        const grid = document.getElementById("seatGrid");
        grid.innerHTML = "";

        let occ = 0, out = 0;
        (data.seats || []).forEach(s => {
          if (s.status === "OCCUPIED") occ++;
          if (s.status === "STEP_OUT") out++;

          const card = document.createElement("div");
          card.className = `seat-card status-${s.status}`;
          
          let statusBadge = "";
          let actions = "";
          if (s.status === "EMPTY") {
            statusBadge = `<span class="seat-badge badge-empty">비어있음</span>`;
            actions = `<button onclick="openCheckInModal('${s.seat_number}')">입실</button>`;
          } else if (s.status === "OCCUPIED") {
            statusBadge = `<span class="seat-badge badge-occ">이용 중</span>`;
            actions = `
              <button onclick="toggleStepOut('${s.seat_number}')">외출</button>
              <button onclick="checkOut('${s.seat_number}')">퇴실</button>
            `;
          } else if (s.status === "STEP_OUT") {
            statusBadge = `<span class="seat-badge badge-out">외출 중</span>`;
            actions = `
              <button onclick="toggleStepOut('${s.seat_number}')">복귀</button>
              <button onclick="checkOut('${s.seat_number}')">퇴실</button>
            `;
          }

          card.innerHTML = `
            <div>
              <div class="seat-header">
                <span class="seat-num">${s.seat_number}</span>
                <span class="seat-zone">${s.zone_type}</span>
              </div>
              <div class="seat-body">
                ${s.current_name ? `<div class="seat-name">${s.current_name}</div>` : `<div style="color:#aaa;">-</div>`}
                ${statusBadge}
                ${s.check_in_at ? `<div class="seat-time">${s.check_in_at.substring(11, 16)} 입실</div>` : ""}
              </div>
            </div>
            <div class="seat-actions">${actions}</div>
          `;
          grid.appendChild(card);
        });

        document.getElementById("metricTotal").textContent = data.seats.length;
        document.getElementById("metricOccupied").textContent = `${occ} (${out})`;
        document.getElementById("metricEmpty").textContent = data.seats.length - (occ + out);
      } catch (err) {
        console.error("좌석 로드 실패", err);
      }
    }

    async function checkOut(seatNum) {
      if (!confirm(`${seatNum} 좌석을 퇴실 처리하시겠습니까?`)) return;
      try {
        const res = await fetch(`${API_BASE}/seats/${seatNum}/check-out`, { method: "POST" });
        const data = await res.json();
        setAlert(data.message || "퇴실 완료", "success");
        loadSeats();
      } catch (err) {
        setAlert("퇴실 처리 실패", "error");
      }
    }

    async function toggleStepOut(seatNum) {
      try {
        const res = await fetch(`${API_BASE}/seats/${seatNum}/step-out`, { method: "POST" });
        const data = await res.json();
        setAlert(data.message, "success");
        loadSeats();
      } catch (err) {
        setAlert("외출/복귀 처리 실패", "error");
      }
    }

    function openCheckInModal(seatNum = "A-01") {
      document.getElementById("checkInSeatNum").value = seatNum;
      document.getElementById("displaySeatNum").value = seatNum;
      openModal("modalCheckIn");
    }

    async function submitCheckIn() {
      const sNum = document.getElementById("checkInSeatNum").value;
      const phone = document.getElementById("checkInPhone").value.trim();
      const name = document.getElementById("checkInName").value.trim();
      if (!phone) { alert("전화번호를 입력해 주세요."); return; }

      try {
        const res = await fetch(`${API_BASE}/seats/${sNum}/check-in`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, name })
        });
        const data = await res.json();
        if (res.ok) {
          closeModal("modalCheckIn");
          setAlert(data.message, "success");
          loadSeats();
        } else {
          setAlert(data.detail || "입실 실패", "error");
        }
      } catch (err) {
        setAlert("입실 요청 오류", "error");
      }
    }

    async function loadTickets() {
      try {
        const res = await fetch(`${API_BASE}/tickets`);
        const data = await res.json();
        const tb = document.querySelector("#ticketsTable tbody");
        tb.innerHTML = "";
        (data.tickets || []).forEach(t => {
          const tr = document.createElement("tr");
          const remain = t.is_time_ticket ? `${t.remaining_minutes}분` : `~${t.valid_until}`;
          const status = t.is_held ? "일시정지 중" : (t.is_active ? "활성" : "만료");
          const btn = t.is_held 
            ? `<button style="font-size:10px;padding:2px 4px;" onclick="resumeTicket('${t.id}')">정지해제</button>`
            : `<button style="font-size:10px;padding:2px 4px;" onclick="holdTicket('${t.id}')">일시정지</button>`;
          tr.innerHTML = `
            <td><b>${t.member_name}</b></td>
            <td>${t.member_phone}</td>
            <td>${t.ticket_type}</td>
            <td>${remain}</td>
            <td>${status}</td>
            <td>${btn}</td>
          `;
          tb.appendChild(tr);
        });
      } catch (err) {
        console.error("이용권 로드 실패", err);
      }
    }

    async function submitTicket() {
      const phone = document.getElementById("tkPhone").value.trim();
      const name = document.getElementById("tkName").value.trim();
      const ticket_type = document.getElementById("tkType").value;
      if (!phone || !name) { alert("성함과 전화번호를 입력하세요."); return; }

      try {
        const res = await fetch(`${API_BASE}/tickets`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, name, ticket_type })
        });
        const data = await res.json();
        closeModal("modalTicket");
        setAlert(data.message || "이용권 발급 완료", "success");
        loadTickets();
      } catch (err) {
        setAlert("이용권 발급 실패", "error");
      }
    }

    async function holdTicket(tid) {
      const days = prompt("일시정지 일수를 입력하세요 (최대 14일, 2회):", "7");
      if (!days) return;
      try {
        const res = await fetch(`${API_BASE}/tickets/${tid}/hold`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ days: Number(days) })
        });
        const data = await res.json();
        if (res.ok) { setAlert(data.message, "success"); loadTickets(); }
        else { setAlert(data.detail, "error"); }
      } catch (err) { setAlert("일시정지 실패", "error"); }
    }

    async function resumeTicket(tid) {
      try {
        const res = await fetch(`${API_BASE}/tickets/${tid}/resume`, { method: "POST" });
        const data = await res.json();
        setAlert(data.message, "success");
        loadTickets();
      } catch (err) { setAlert("정지 해제 실패", "error"); }
    }

    // AI 도구 질의
    async function sendAI() {
      const inp = document.getElementById("aiInput");
      const q = inp.value.trim();
      if (!q) return;
      const out = document.getElementById("aiResponse");
      out.textContent = "AI 비서 분석 및 도구 호출 중... ⏳";
      try {
        const res = await fetch(`${API_BASE}/ai/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q, mode: "auto" })
        });
        const data = await res.json();
        out.textContent = data.reply || JSON.stringify(data, null, 2);
        loadSeats();
      } catch (err) {
        out.textContent = "AI 통신 실패";
      }
    }

    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }

    // 초기화
    loadSeats();
  </script>
</body>
</html>
