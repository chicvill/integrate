<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Guestbook</title>
    <style>
        :root { --tv-body: #8d6e63; --tv-screen: #212121; --neon-green: #76ff03; --dial-color: #dce775; }
        
        body { 
            background-color: #2c2c2c; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', Courier, monospace; 
            color: #e0e0e0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .main-container { 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            gap: 25px; 
            padding: 15px; 
        }

        /* [왼쪽 구역] */
        .left-container {
            display: flex; flex-direction: column; gap: 15px; 
            width: 252px; /* 너비 90% 유지 */
            margin-top: 0; 
        }

        /* [추가됨] 메인 타이틀 스타일 */
        .main-title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 0 #000;
            border-bottom: 4px solid var(--neon-green);
            padding-bottom: 10px;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }

        .guide-panel {
            background: rgba(0,0,0,0.6); padding: 20px; border-radius: 12px;
            border-left: 4px solid var(--neon-green); box-shadow: 4px 4px 12px rgba(0,0,0,0.5);
        }
        .guide-panel h2 { margin-top: 0; color: var(--neon-green); border-bottom: 1px solid #555; padding-bottom: 8px; font-size: 18px; }
        .guide-panel ul { padding-left: 18px; line-height: 1.6; font-size: 14px; margin-bottom: 0; }
        .guide-panel li { margin-bottom: 6px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button { 
            padding: 15px 20px; font-size: 16px; font-family: inherit; font-weight: bold; cursor: pointer; 
            border-radius: 10px; border: none; box-shadow: 0 5px #111; transition: all 0.1s; outline: none; width: 100%; 
        }
        #startBtn { background: #d32f2f; color: white; }
        #saveBtn { background: #388e3c; color: white; display: none; }
        button:active { transform: translateY(3px); box-shadow: 0 2px #111; }
        button:disabled { background: #616161; color: #aaa; cursor: not-allowed; box-shadow: none; transform: translateY(3px); }

        /* [중앙 구역] TV */
        .tv-section { display: flex; flex-direction: column; align-items: center; }
        .tv-frame {
            background: var(--tv-body);
            width: 780px; 
            padding: 30px 40px 30px 30px; 
            border-radius: 50px; 
            position: relative;
            box-shadow: inset -10px -10px 25px rgba(0,0,0,0.4), 20px 20px 50px rgba(0,0,0,0.9);
            border: 10px solid #4e342e; 
            display: flex;
        }
        .screen-container {
            background: var(--tv-screen); width: 650px; height: 494px; border-radius: 40px; border: 20px solid #1a1a1a;
            position: relative; overflow: hidden; box-shadow: inset 0 0 100px rgba(0,0,0,0.95);
        }
        video { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.2) saturation(1.1); }
        .tv-controls-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-left: 30px; gap: 25px; padding-top: 15px; }
        .dial { 
            width: 65px; height: 65px; background: #3e2723; border-radius: 50%; border: 4px solid #2d1f1b; position: relative; 
            display: flex; justify-content: center; align-items: center; box-shadow: 4px 4px 8px rgba(0,0,0,0.5); transition: transform 0.3s;
        }
        #dial-display { font-size: 56px; color: var(--dial-color); font-weight: bold; text-shadow: 0 0 8px var(--dial-color); font-family: 'Impact', fantasy; letter-spacing: 1px; }
        .speaker-grill { width: 55px; height: 110px; background: repeating-linear-gradient(#1a1a1a, #1a1a1a 4px, #3e2723 4px, #3e2723 8px); border-radius: 4px; }
        #central-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; color: var(--neon-green); text-shadow: 0 0 30px var(--neon-green); font-weight: bold; z-index: 10; pointer-events: none; display: none; }

        /* [오른쪽 구역] 갤러리 */
        .right-container {
            width: 280px;
            height: 580px; 
            background: #1e1e1e;
            border: 8px solid #4e342e;
            border-radius: 12px;
            padding: 12px;
            display: flex; flex-direction: column;
            box-shadow: 8px 8px 25px rgba(0,0,0,0.5);
        }
        .gallery-header {
            text-align: center; color: var(--dial-color); border-bottom: 2px dashed #555; padding-bottom: 8px; margin-bottom: 8px; font-weight: bold; font-size: 16px;
        }
        .gallery-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .gallery-list::-webkit-scrollbar { width: 6px; }
        .gallery-list::-webkit-scrollbar-thumb { background: #5d4037; border-radius: 3px; }
        .gallery-list::-webkit-scrollbar-track { background: #2c2c2c; }
        .video-item {
            margin-bottom: 15px;
            background: #000;
            border: 2px solid #555;
            border-radius: 6px;
            overflow: hidden;
            height: 160px; 
            display: flex; flex-direction: column;
        }
        .video-item video { width: 100%; height: 100%; object-fit: contain; }
        .video-date { background: #333; color: #fff; font-size: 11px; padding: 4px; text-align: center; }

    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="left-container">
            <h1 class="main-title">디지털 방명록</h1>

            <div class="guide-panel">
                <h2>📺 디지털 방명록 안내</h2>
                <ul>
                    
                    <li>🔴 <strong>[촬영 시작]</strong> 버튼을 누르면 <strong>3, 2, 1</strong> 후 녹화 시작!</li>
                    <li>⏱️ 다이얼이 <strong>10초</strong>를 카운트합니다.</li>
                    <li>💾 <strong>[정지 및 저장]</strong> 누르면 즉시 저장됩니다.</li>
                </ul>
            </div>
            <div class="btn-group">
                <button id="startBtn">촬영 시작</button>
                <button id="saveBtn">정지 및 저장</button>
            </div>
        </div>

        <div class="tv-section">
            <div class="tv-frame">
                <div class="screen-container">
                    <video id="preview" autoplay muted playsinline></video>
                    <div id="central-overlay"></div>
                </div>
                <div class="tv-controls-panel">
                    <div class="dial" id="dial-ring">
                        <div id="dial-display">CH</div>
                    </div>
                    <div class="dial" style="transform: rotate(45deg);"></div>
                    <div class="speaker-grill"></div>
                </div>
            </div>
        </div>

        <div class="right-container">
            <div class="gallery-header">📼 VIDEO TAPE RACK</div>
            <div class="gallery-list" id="gallery-list">
                <div style="text-align: center; color: #555; margin-top: 20px;">Loading...</div>
            </div>
        </div>

    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let globalStream; 
        
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const saveBtn = document.getElementById('saveBtn');
        const centralOverlay = document.getElementById('central-overlay');
        const dialDisplay = document.getElementById('dial-display');
        const dialRing = document.getElementById('dial-ring');
        const galleryList = document.getElementById('gallery-list');

        window.onload = async () => {
            await initCamera();
            loadGallery();
        };

        async function initCamera() {
            try {
                globalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                preview.srcObject = globalStream;
            } catch (err) {
                alert("카메라 권한 오류");
            }
        }

        async function loadGallery() {
            try {
                const response = await fetch('/list');
                const files = await response.json();
                
                galleryList.innerHTML = '';

                if(files.length === 0) {
                    galleryList.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">저장된 영상이<br>없습니다.</div>';
                    return;
                }

                files.forEach(file => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'video-item';
                    const datePart = file.replace('guestbook_', '').replace('.webm', '');
                    const formattedDate = `${datePart.slice(0,4)}-${datePart.slice(4,6)}-${datePart.slice(6,8)} ${datePart.slice(9,11)}:${datePart.slice(11,13)}`;

                    itemDiv.innerHTML = `
                        <video controls src="/data/${file}"></video>
                        <div class="video-date">${formattedDate}</div>
                    `;
                    galleryList.appendChild(itemDiv);
                });

            } catch (err) {
                console.error("갤러리 로드 실패", err);
            }
        }

        // --- [추가됨] 음성 안내 함수 (TTS) ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR'; // 한국어 설정
                utterance.rate = 1.2; // 약간 빠르게
                window.speechSynthesis.speak(utterance);
            }
        }

        startBtn.onclick = () => {
            if (!globalStream) return alert("카메라 준비 안됨");
            startBtn.disabled = true;
            
            let count = 3;
            centralOverlay.style.display = 'block';
            centralOverlay.innerText = count;
            
            speak("3"); // "삼"

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    centralOverlay.innerText = count;
                    speak(count.toString()); // "이", "일"
                } else {
                    clearInterval(timer);
                    centralOverlay.style.display = 'none'; 
                    //speak("녹화를 시작합니다"); // 안내 멘트
                    startRecording(); 
                }
            }, 1000);
        };

        function startRecording() {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(globalStream);
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = saveVideo;
            mediaRecorder.start();
            
            saveBtn.style.display = 'block';
            saveBtn.disabled = false;
            saveBtn.innerText = "정지 및 저장";
            saveBtn.onclick = () => { if (mediaRecorder.state === "recording") mediaRecorder.stop(); };

            let recordCount = 10;
            dialDisplay.innerText = recordCount;
            dialDisplay.style.color = "#ff3d00"; 
            dialRing.style.transform = "rotate(0deg)";

            const recordTimer = setInterval(() => {
                recordCount--;
                //dialRing.style.transform = `rotate(${ (10-recordCount) * 30 }deg)`;
                if (recordCount > 0) dialDisplay.innerText = recordCount;
                else {
                    clearInterval(recordTimer);
                    if (mediaRecorder.state === "recording") mediaRecorder.stop();
                }
            }, 1000);

            mediaRecorder.addEventListener('stop', () => {
                clearInterval(recordTimer);
                dialDisplay.innerText = "CH";
                dialDisplay.style.color = ""; 
                dialRing.style.transform = "rotate(0deg)";
                startBtn.disabled = false; 
            });
        }

        async function saveVideo() {
            saveBtn.innerText = "저장 중...";
            saveBtn.disabled = true;

            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('video', blob);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const result = await response.json();
                
                if (result.success) {
                    //alert("✅ 저장 완료!");
                    speak("저장되었습니다."); // 안내 멘트
                    saveBtn.style.display = 'none';
                    loadGallery();
                } else {
                    alert("저장 실패");
                }
            } catch (err) {
                alert("서버 연결 오류");
                saveBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
