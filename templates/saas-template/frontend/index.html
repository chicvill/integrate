<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{APP_NAME}} - MQnet SaaS Platform</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- MQnet SaaS Standard CSS (Direct Link + Cache Busting) -->
  <link rel="stylesheet" href="./css/variables.css?v=1.0">
  <link rel="stylesheet" href="./css/layout.css?v=1.0">
  <link rel="stylesheet" href="./css/components.css?v=1.0">
  <link rel="stylesheet" href="./style.css?v=1.0">
  <link rel="stylesheet" href="/shared/ui/auth.css?v=2.0">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="saas-header">
    <div class="header-left">
      <span class="app-icon">{{APP_ICON}}</span>
      <div class="brand-titles">
        <h1 class="brand-title">{{APP_NAME}}</h1>
        <span class="brand-badge">SaaS Edition</span>
      </div>
    </div>

    <div class="header-right">
      <div class="system-status-indicator" id="systemStatusBeacon">
        <span class="status-dot online"></span>
        <span class="status-text" id="systemStatusText">연결 중...</span>
      </div>
      <div id="authContainer">
        <!-- Auth button rendered dynamically by auth.js -->
        <button id="authBtn" class="btn btn-secondary btn-sm">로그인</button>
      </div>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="saas-container">
    <!-- Hero / KPI Banner -->
    <section class="kpi-banner">
      <div class="kpi-card">
        <span class="kpi-label">등록된 아이템</span>
        <span class="kpi-value" id="kpiTotalItems">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">활성 (Active)</span>
        <span class="kpi-value highlight" id="kpiActiveItems">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">시스템 상태</span>
        <span class="kpi-value healthy">정상 운영</span>
      </div>
    </section>

    <!-- Toolbar: Search, Filters, Actions -->
    <section class="toolbar-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="검색어 입력..." autocomplete="off">
        <button id="searchBtn" class="btn btn-secondary">검색</button>
      </div>
      <div class="filter-actions">
        <select id="statusFilter" class="select-dropdown">
          <option value="">전체 상태</option>
          <option value="active">Active (활성)</option>
          <option value="pending">Pending (대기)</option>
          <option value="completed">Completed (완료)</option>
        </select>
        <button id="openCreateModalBtn" class="btn btn-primary">+ 신규 등록</button>
        <button id="openAiModalBtn" class="btn btn-ai">✨ AI 분석</button>
      </div>
    </section>

    <!-- Items Grid / List Container (Flex-shrink defense applied) -->
    <section class="items-view-section">
      <div id="itemsGrid" class="items-grid">
        <!-- Rendered by ui.js -->
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <span class="empty-icon">{{APP_ICON}}</span>
        <h3>등록된 항목이 없습니다.</h3>
        <p>신규 등록 버튼을 눌러 첫 번째 항목을 추가해보세요.</p>
      </div>
    </section>
  </main>

  <!-- Modal: Item Create / Edit -->
  <div id="itemModal" class="modal-overlay" style="display: none;">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h3 id="modalTitle">신규 항목 등록</h3>
        <button class="modal-close" id="closeItemModalBtn">&times;</button>
      </div>
      <form id="itemForm" class="modal-form">
        <input type="hidden" id="editItemId" value="">
        <div class="form-group">
          <label for="itemTitle">명칭 (Title) *</label>
          <input type="text" id="itemTitle" required placeholder="항목 이름을 입력하세요">
        </div>
        <div class="form-group">
          <label for="itemCategory">카테고리</label>
          <input type="text" id="itemCategory" placeholder="예: 일반, 중요, 긴급">
        </div>
        <div class="form-group">
          <label for="itemStatus">상태</label>
          <select id="itemStatus">
            <option value="active">Active (활성)</option>
            <option value="pending">Pending (대기)</option>
            <option value="completed">Completed (완료)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="itemDetail">상세 설명</label>
          <textarea id="itemDetail" rows="3" placeholder="세부 내용 또는 비고를 입력하세요"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelItemModalBtn">취소</button>
          <button type="submit" class="btn btn-primary" id="saveItemBtn">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: AI Copilot Assistant -->
  <div id="aiModal" class="modal-overlay" style="display: none;">
    <div class="modal-content glass-card ai-modal">
      <div class="modal-header">
        <h3>✨ {{APP_NAME}} AI 코파일럿</h3>
        <button class="modal-close" id="closeAiModalBtn">&times;</button>
      </div>
      <div class="ai-body">
        <p class="ai-desc">운영 데이터 분석, 이상 징후 감지 및 추천 액션을 질문해보세요.</p>
        <div class="form-group">
          <textarea id="aiPrompt" rows="3" placeholder="예: 현재 등록된 항목들의 진행 효율을 높이는 방안을 제안해줘."></textarea>
        </div>
        <button id="submitAiBtn" class="btn btn-ai btn-block">분석 실행</button>
        <div id="aiResultBox" class="ai-result-box" style="display: none;">
          <div class="ai-result-header">분석 결과:</div>
          <div id="aiResultContent" class="ai-result-content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- MQnet Shared Auth Module -->
  <script type="module" src="/shared/ui/auth.js?v=2.0"></script>
  <!-- Main Frontend Entrypoint -->
  <script type="module" src="./app.js?v=1.0"></script>
</body>
</html>
