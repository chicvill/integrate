<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{APP_NAME}} - MQnet SaaS Platform</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- MQnet SaaS Standard CSS (Direct Link + Cache Busting) -->
  <link rel="stylesheet" href="./css/variables.css?v=2.0">
  <link rel="stylesheet" href="./css/layout.css?v=2.0">
  <link rel="stylesheet" href="./css/components.css?v=2.0">
  <link rel="stylesheet" href="./style.css?v=2.0">
  <link rel="stylesheet" href="/shared/ui/theme.css?v=2.0">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="saas-header">
    <div class="header-left">
      <span class="app-icon">{{APP_ICON}}</span>
      <div class="brand-titles">
        <h1 class="brand-title">{{APP_NAME}}</h1>
        <span class="brand-badge">SaaS Edition</span>
      </div>
    </div>

    <!-- 다중 매장(Multi-Branch) 관제 셀렉터 -->
    <div class="header-center">
      <div class="branch-selector-wrapper">
        <span class="branch-icon">🏢</span>
        <select id="branchSelector" class="form-select branch-select">
          <option value="">전체 매장 (통합 관제)</option>
        </select>
        <button id="openBranchModalBtn" class="btn btn-secondary btn-xs" title="신규 매장 등록">➕ 매장 등록</button>
        <a href="./branches.html" class="btn btn-primary btn-xs" style="text-decoration: none;" title="본사용 매장 및 수납 관리 센터">⚙️ 매장 관리 센터</a>
        <a href="./manual.html" target="_blank" class="btn btn-secondary btn-xs" style="text-decoration: none;" title="공식 운영 매뉴얼 보기">📖 매뉴얼</a>
      </div>
    </div>

    <div class="header-right">
      <div class="system-status-indicator" id="systemStatusBeacon">
        <span class="status-dot online"></span>
        <span class="status-text" id="systemStatusText">연결 중...</span>
      </div>
      <!-- MQnet 공통 인증 사용자 배지 컨테이너 -->
      <div id="userAuthBadge"></div>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="saas-container">
    <!-- Hero / KPI Banner -->
    <section class="kpi-banner">
      <div class="kpi-card">
        <span class="kpi-label">등록된 아이템</span>
        <span class="kpi-value" id="kpiTotalItems">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">활성 (Active)</span>
        <span class="kpi-value highlight" id="kpiActiveItems">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">현재 매장</span>
        <span class="kpi-value healthy" id="kpiCurrentBranch">전체 매장</span>
      </div>
    </section>

    <!-- Toolbar / Search / Action Controls -->
    <section class="toolbar-section">
      <div class="search-filter-box">
        <input type="text" id="searchInput" class="form-input" placeholder="검색어 입력..." autocomplete="off">
        <button id="searchBtn" class="btn btn-secondary btn-sm">검색</button>
        <select id="statusFilter" class="form-select">
          <option value="">모든 상태</option>
          <option value="active">활성 (Active)</option>
          <option value="pending">대기 (Pending)</option>
          <option value="completed">완료 (Completed)</option>
        </select>
      </div>
      <div class="action-buttons">
        <button id="openAiModalBtn" class="btn btn-ai btn-sm">
          <span>✨</span> AI 분석 / 어시스턴트
        </button>
        <button id="openCreateModalBtn" class="btn btn-primary btn-sm">
          <span>+</span> 신규 등록
        </button>
      </div>
    </section>

    <!-- Dynamic Items Grid -->
    <section class="content-section">
      <div id="itemsGrid" class="items-grid">
        <!-- Rendered dynamically by js/ui.js -->
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <span class="empty-icon">📭</span>
        <p class="empty-text">등록된 항목이 없습니다. 새로운 항목을 추가해보세요.</p>
        <button id="emptyCreateBtn" class="btn btn-primary btn-sm">항목 등록하기</button>
      </div>
    </section>
  </main>

  <!-- Modal: Item Create / Edit -->
  <div id="itemModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle" class="modal-title">신규 항목 등록</h3>
        <button id="closeItemModalBtn" class="modal-close">&times;</button>
      </div>
      <form id="itemForm" class="modal-body">
        <input type="hidden" id="editItemId">
        <div id="itemModalAlert" class="hidden"></div>
        <div class="form-group">
          <label for="itemBranch" class="form-label">소속 매장 (지점)</label>
          <select id="itemBranch" class="form-select">
            <option value="main">MQnet 본점</option>
          </select>
        </div>
        <div class="form-group">
          <label for="itemTitle" class="form-label">명칭 / 제목</label>
          <input type="text" id="itemTitle" class="form-input" required placeholder="항목 명칭을 입력하세요">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="itemCategory" class="form-label">카테고리</label>
            <input type="text" id="itemCategory" class="form-input" placeholder="기본: 일반">
          </div>
          <div class="form-group">
            <label for="itemStatus" class="form-label">상태</label>
            <select id="itemStatus" class="form-select">
              <option value="active">활성 (Active)</option>
              <option value="pending">대기 (Pending)</option>
              <option value="completed">완료 (Completed)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="itemDetail" class="form-label">상세 내용</label>
          <textarea id="itemDetail" class="form-textarea" rows="3" placeholder="추가 설명 및 세부 내용"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelItemModalBtn" class="btn btn-secondary">취소</button>
          <button type="submit" class="btn btn-primary">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Branch Create (신규 매장 등록) -->
  <div id="branchModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">🏢 신규 매장(지점) 등록</h3>
        <button id="closeBranchModalBtn" class="modal-close">&times;</button>
      </div>
      <form id="branchForm" class="modal-body">
        <div id="branchModalAlert" class="hidden"></div>
        <div class="form-group">
          <label for="branchCode" class="form-label">매장 코드 (branch_id)</label>
          <input type="text" id="branchCode" class="form-input" required placeholder="예: branch-sinchon, branch-pangyo">
        </div>
        <div class="form-group">
          <label for="branchName" class="form-label">매장명</label>
          <input type="text" id="branchName" class="form-input" required placeholder="예: MQnet 신촌점">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="branchPhone" class="form-label">매장 연락처</label>
            <input type="text" id="branchPhone" class="form-input" placeholder="02-123-4567">
          </div>
          <div class="form-group">
            <label for="branchAddress" class="form-label">매장 주소</label>
            <input type="text" id="branchAddress" class="form-input" placeholder="매장 소재지 주소">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelBranchModalBtn" class="btn btn-secondary">취소</button>
          <button type="submit" class="btn btn-primary">매장 등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: AI Assistant / Analysis -->
  <div id="aiModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">✨ Gemini AI 어시스턴트</h3>
        <button id="closeAiModalBtn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="aiPrompt" class="form-label">AI 요청 사항 / 프롬프트</label>
          <textarea id="aiPrompt" class="form-textarea" rows="3" placeholder="예: 현재 등록된 항목들의 진행 상황을 요약하고 개선 조치 사항을 제안해줘."></textarea>
        </div>
        <button id="submitAiBtn" class="btn btn-ai" style="width: 100%;">
          <span>⚡</span> AI 심층 분석 실행
        </button>
        <div id="aiResultBox" class="ai-result-box" style="display: none; margin-top: 1rem;">
          <div class="ai-result-header">분석 결과:</div>
          <div id="aiResultContent" class="ai-result-content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 보안 로그인 및 14일 슬라이딩 세션 게이트 -->
  <div id="loginSecurityModal" class="modal-backdrop" style="display: none; z-index: 9999; backdrop-filter: blur(8px); background: rgba(11, 15, 25, 0.88);">
    <div class="modal-card" style="max-width: 380px; width: 100%; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
      <div class="modal-header" style="text-align: center; display: block; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem;">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🛡️</div>
        <h3 class="modal-title" style="font-size: 1.15rem; margin-bottom: 0.25rem;">MQnet SaaS 관리자 보안 로그인</h3>
        <p style="font-size: 0.75rem; color: #94a3b8; margin: 0;">시스템 데이터 보호를 위해 관리자 인증이 필요합니다.</p>
      </div>
      <div class="modal-body">
        <form onsubmit="handleSecurityLoginSubmit(event)" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div class="form-group" style="margin: 0;">
            <label class="form-label" style="font-size: 0.75rem;">관리자 아이디</label>
            <input type="text" id="loginUsername" required class="form-input" placeholder="예: admin, admin01" style="font-size: 0.85rem; padding: 0.6rem;">
          </div>
          <div class="form-group" style="margin: 0;">
            <label class="form-label" style="font-size: 0.75rem;">비밀번호</label>
            <input type="password" id="loginPassword" required class="form-input" placeholder="비밀번호 입력 (예: 1212)" style="font-size: 0.85rem; padding: 0.6rem;">
          </div>
          <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: #34d399; background: rgba(16, 185, 129, 0.1); padding: 0.45rem 0.6rem; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.25);">
            <span>🛡️</span>
            <span>이 기기에서 <strong>14일간 자동 로그인</strong> 유지</span>
          </div>
          <div id="loginErrMsg" style="display: none; color: #f87171; font-size: 0.75rem; text-align: center; background: rgba(248, 113, 113, 0.1); padding: 0.4rem; border-radius: 6px;"></div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <button type="button" id="securityModalCancelBtn" onclick="closeLoginSecurityModal()" class="btn btn-secondary" style="flex: 1; display: none;">닫기</button>
            <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="flex: 2; font-weight: bold;">🔒 보안 로그인 (14일 유지)</button>
          </div>
        </form>
        <div style="margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid rgba(255,255,255,0.08); text-align: center;">
          <span style="font-size: 0.7rem; color: #64748b; display: block; margin-bottom: 0.4rem;">빠른 계정 선택:</span>
          <div style="display: flex; justify-content: center; gap: 0.35rem; flex-wrap: wrap;">
            <button type="button" onclick="fillQuickLogin('admin', '1212')" class="btn btn-secondary btn-xs" style="font-size: 0.7rem;">본사총괄 (admin)</button>
            <button type="button" onclick="fillQuickLogin('admin01', '1212')" class="btn btn-secondary btn-xs" style="font-size: 0.7rem;">1호점실장 (admin01)</button>
            <button type="button" onclick="fillQuickLogin('admin02', '1212')" class="btn btn-secondary btn-xs" style="font-size: 0.7rem;">2호점실장 (admin02)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./app.js?v=2.0"></script>
</body>
</html>
