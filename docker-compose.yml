# MQnet 통합 SaaS 플랫폼 - Docker Compose
# 실행: docker compose up -d

services:
  # ─── 통합 API 게이트웨이 & 포털 (포트 9000 & 10000) ───────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: mqnet-integrate:latest
    container_name: mqnet-gateway
    ports:
      - "9000:9000"
      - "10000:9000"
    environment:
      - DEPLOYMENT_MODE=DOCKER
      - PYTHONPATH=/app
    volumes:
      - .:/app
    env_file:
      - .env.shared
    command: python -m uvicorn gateway.main:app --host 0.0.0.0 --port 9000
    restart: unless-stopped

  # ─── 스터디카페 독립 컨테이너 (포트 9002) ─────────────────────────────
  studycafe:
    image: mqnet-integrate:latest
    container_name: mqnet-studycafe
    working_dir: /app/apps/studycafe
    ports:
      - "9002:9002"
    environment:
      - PYTHONPATH=/app:/app/apps/studycafe
    volumes:
      - .:/app
    env_file:
      - .env.shared
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 9002
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── 자기주도학습 독립 컨테이너 (포트 9003) ───────────────────────────
  selfstudy:
    image: mqnet-integrate:latest
    container_name: mqnet-selfstudy
    working_dir: /app/apps/selfstudy/SelfStudy/backend
    ports:
      - "9003:9003"
    environment:
      - PYTHONPATH=/app:/app/apps/selfstudy/SelfStudy/backend
    volumes:
      - .:/app
    env_file:
      - .env.shared
    command: python -m uvicorn main:app --host 0.0.0.0 --port 9003
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── 매장 관제 & POS 독립 컨테이너 (포트 9004) ──────────────────────────
  store:
    image: mqnet-integrate:latest
    container_name: mqnet-store
    working_dir: /app/apps/store
    ports:
      - "9004:9004"
    environment:
      - PYTHONPATH=/app:/app/apps/store
    volumes:
      - .:/app
    env_file:
      - .env.shared
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 9004
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── 스마트팜 IoT 독립 컨테이너 (포트 9005) ────────────────────────────────
  smartfarm:
    image: mqnet-integrate:latest
    container_name: mqnet-smartfarm
    working_dir: /app/apps/smartfarm
    ports:
      - "9005:9005"
    environment:
      - PYTHONPATH=/app:/app/apps/smartfarm
    volumes:
      - .:/app
    env_file:
      - .env.shared
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 9005
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── AI 관상 분석 독립 컨테이너 (포트 9009) ─────────────────────────────────
  ai_gwansang:
    image: mqnet-integrate:latest
    container_name: mqnet-ai-gwansang
    working_dir: /app/apps/ai_gwansang
    ports:
      - "9009:9009"
    environment:
      - PYTHONPATH=/app:/app/apps/ai_gwansang
    volumes:
      - .:/app
    env_file:
      - .env.shared
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 9009
    restart: unless-stopped
    depends_on:
      - gateway
