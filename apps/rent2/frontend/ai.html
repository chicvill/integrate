<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQnet 임차관리 AI 비서 & 타임라인</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .header-links a:hover {
      background: var(--border);
      color: var(--text);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
      .timeline-panel {
        display: none;
      }
    }
    /* AI Chat Panel */
    .chat-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }
    .chat-logs {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
    }
    .msg.ai {
      align-self: flex-start;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .msg.system {
      align-self: center;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.85rem;
    }
    .pending-card {
      margin-top: 8px;
      padding: 10px 12px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warning);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .pending-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    button.btn {
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .chat-input-area {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .chat-input:focus {
      border-color: var(--primary);
    }
    .quick-chips {
      display: flex;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(0,0,0,0.1);
      overflow-x: auto;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .chip {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover {
      color: var(--text);
      background: var(--border);
    }

    /* Timeline Panel */
    .timeline-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .timeline-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timeline-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-item {
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      font-size: 0.82rem;
    }
    .timeline-time {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 3px;
    }
    .timeline-action {
      font-weight: 600;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span>🤖</span>
      <span>MQnet 임차관리 AI 비서 (rent2 객체 모델)</span>
    </div>
    <div class="header-links">
      <a href="/index.html">🏠 전산 화면 바로가기</a>
      <a href="/branches.html">🏢 본사 지점센터</a>
    </div>
  </header>

  <main>
    <!-- AI 대화창 -->
    <section class="chat-panel">
      <div class="chat-header">
        <div>
          <strong id="buildingName">시크빌 1호점</strong>
          <span style="color:var(--muted); font-size:0.8rem; margin-left:6px;" id="userStatus">로그인 확인 중...</span>
        </div>
        <div style="font-size:0.8rem; color:var(--muted);" id="engineInfo">엔진: 조회 중...</div>
      </div>

      <div class="chat-logs" id="chatLogs">
        <div class="msg system">
          💡 임차관리 AI 비서입니다. 자연어로 질문하거나 업무 지시를 내리세요.<br>
          예: "시크빌 이번 달 미납 현황 알려줘", "201호 정보 카드 보여줘", "5월 복도 전등 교체 3만원 지출 기록해줘"
        </div>
      </div>

      <div class="quick-chips">
        <span class="chip" onclick="sendPrompt('건물 요약 브리핑해줘')">📊 건물 요약</span>
        <span class="chip" onclick="sendPrompt('이번 달 미납 누구누구야?')">⚠️ 이번 달 미납</span>
        <span class="chip" onclick="sendPrompt('공실 목록 보여줘')">🚪 공실 목록</span>
        <span class="chip" onclick="sendPrompt('만기 2달 내 도래 계약 알려줘')">⏰ 만기 도래</span>
        <span class="chip" onclick="sendPrompt('상반기 부가세 요약 집계해줘')">🧾 부가세 요약</span>
      </div>

      <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="AI에게 질문이나 업무를 요청하세요 (Enter로 전송)..." onkeydown="if(event.key==='Enter') doSend()">
        <button class="btn btn-primary" onclick="doSend()">전송</button>
      </div>
    </section>

    <!-- 실시간 객체 타임라인 패널 -->
    <aside class="timeline-panel">
      <div class="timeline-header">
        <span>📜 객체 타임라인 (감사 로그)</span>
        <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" onclick="loadTimeline()">새로고침</button>
      </div>
      <div class="timeline-list" id="timelineList">
        <div style="color:var(--muted); font-size:0.85rem; text-align:center; padding-top:20px;">기록을 불러오는 중...</div>
      </div>
    </aside>
  </main>

  <script>
    const token = localStorage.getItem('mqnet_auth_token') || sessionStorage.getItem('mqnet_auth_token') || '';
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': token ? `Bearer ${token}` : ''
    };

    function appendMsg(text, type = 'ai') {
      const logs = document.getElementById('chatLogs');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      logs.appendChild(div);
      logs.scrollTop = logs.scrollHeight;
      return div;
    }

    async function doSend() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMsg(text, 'user');

      try {
        const res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers,
          body: JSON.stringify({ message: text, building: 'main', mode: 'confirm' })
        });
        const data = await res.json();
        if (!res.ok) {
          appendMsg(`⚠️ 오류: ${data.detail || '응답을 받지 못했습니다.'}`, 'ai');
          return;
        }

        const msgBox = appendMsg(data.reply || '(실행 완료)', 'ai');

        // 쓰기 도구 실행 전 확인 버튼(Confirm) 렌더링
        if (data.pending && data.pending.length > 0) {
          data.pending.forEach(p => {
            const card = document.createElement('div');
            card.className = 'pending-card';
            card.innerHTML = `
              <div><strong>[실행 승인 대기]</strong> ${p.summary}</div>
              <div style="font-size:0.8rem; color:#fde68a; margin-top:2px;">도구: ${p.tool} (${JSON.stringify(p.args)})</div>
              <div class="pending-actions">
                <button class="btn btn-success" onclick="executePending('${p.id}', this)">실행 승인 ✅</button>
              </div>
            `;
            msgBox.appendChild(card);
          });
        }

        // 타임라인 즉시 새로고침
        loadTimeline();
      } catch (err) {
        appendMsg(`⚠️ 네트워크 오류: ${err.message}`, 'ai');
      }
    }

    async function executePending(pid, btn) {
      btn.disabled = true;
      btn.innerText = '실행 중... ⏳';
      try {
        const res = await fetch('/api/ai/execute', {
          method: 'POST',
          headers,
          body: JSON.stringify({ pending_id: pid })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(`실행 실패: ${data.detail || '오류 발생'}`);
          btn.disabled = false;
          btn.innerText = '재시도';
          return;
        }
        btn.parentElement.innerHTML = `<span style="color:#34d399; font-weight:600;">실행 완료! (${data.message || '완료'})</span>`;
        loadTimeline();
      } catch (err) {
        alert(`네트워크 오류: ${err.message}`);
        btn.disabled = false;
        btn.innerText = '실행 승인 ✅';
      }
    }

    function sendPrompt(text) {
      document.getElementById('chatInput').value = text;
      doSend();
    }

    async function loadTimeline() {
      const list = document.getElementById('timelineList');
      try {
        const res = await fetch('/api/objects/timeline?limit=25', { headers });
        if (!res.ok) {
          list.innerHTML = `<div style="color:var(--muted); font-size:0.8rem; text-align:center;">로그인 후 타임라인이 표시됩니다.</div>`;
          return;
        }
        const data = await res.json();
        if (!data.events || data.events.length === 0) {
          list.innerHTML = `<div style="color:var(--muted); font-size:0.8rem; text-align:center;">아직 기록된 이벤트가 없습니다.</div>`;
          return;
        }
        list.innerHTML = data.events.map(e => `
          <div class="timeline-item">
            <div class="timeline-time">${e.at.replace('T', ' ')} · <strong>${e.actor}</strong></div>
            <div><span class="timeline-action">${e.kind}.${e.action}</span>: ${e.detail?.summary || JSON.stringify(e.detail)}</div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div style="color:var(--muted); font-size:0.8rem;">타임라인 로드 실패</div>`;
      }
    }

    // 초기화
    (async function init() {
      try {
        const res = await fetch('/api/ai/tools', { headers });
        const data = await res.json();
        document.getElementById('engineInfo').innerText = `엔진: ${data.engine} (${data.tools?.length || 0}개 도구)`;
      } catch (_) {}
      loadTimeline();
    })();
  </script>
</body>
</html>
